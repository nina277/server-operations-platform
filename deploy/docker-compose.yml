# 自律型サーバー運用支援システム (server-operations-platform)
# 既存システムとは独立したComposeプロジェクトとして運用する。
name: server-operations

# Dockerの既定(json-file)は上限が無く、放っておくとディスクを埋める。
# ディスク使用率を監視するシステム自身がディスクを埋めては話にならない。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # 外部へ公開するポートはこの1つだけ
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    logging: *default-logging
    mem_limit: 128m
    healthcheck:
      # localhost ではなく 127.0.0.1 を使う。
      # このconfはイメージ同梱版と異なるため、nginx画像の
      # 10-listen-on-ipv6-by-default.sh が listen [::]:80 を足さない。
      # busyboxのwgetは localhost を ::1 に解決して接続拒否になり、
      # (curlと違い)IPv4へ落ちないため、**常に unhealthy になる。**
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - frontend

  web:
    build:
      context: ../client-web
      args:
        # Push通知(FCM)の設定。未指定なら画面は通知を「未設定」として扱う。
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 128m
    healthcheck:
      # nginx と同じ理由で 127.0.0.1 を使う(localhost は ::1 になり接続拒否)
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # 外部ポートは公開しない(nginx経由でのみアクセスする)
    networks:
      - frontend

  api:
    build:
      context: ../server
      dockerfile: ServerOperations.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TZ: ${TZ:-Asia/Tokyo}
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;"
      Database__AutoMigrate: "true"
      DataProtection__KeysPath: /app/keys
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      InitialAdmin__Username: ${INITIAL_ADMIN_USERNAME:-}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      # Data Protection鍵(MFAシークレット暗号化)をコンテナ再作成後も保持する
      - api-keys:/app/keys
    logging: *default-logging
    mem_limit: 512m
    # livenessを見る。restart: unless-stopped はプロセスが死んだときしか効かず、
    # 生きているが応答しない状態は検知できないため。
    # readinessではなくlivenessを使う。DBが落ちただけで再起動しても直らない。
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 外部ポートは公開しない(nginx経由でのみアクセスする)
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - frontend
      - backend

  worker:
    build:
      context: ../server
      dockerfile: ServerOperations.Worker/Dockerfile
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TZ: ${TZ:-Asia/Tokyo}
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};CharSet=utf8mb4;"
      Collection__Cron: "${COLLECTION_CRON:-* * * * *}"
      DataProtection__KeysPath: /app/keys
    volumes:
      # APIと同じData Protection鍵を共有する(APIが暗号化した対象資格情報の復号に必要)
      - api-keys:/app/keys
    logging: *default-logging
    mem_limit: 512m
    # Workerはweb口を持たないため、生存を示すファイルの古さで見る。
    # Workerが1分ごとに更新し、3分以上古ければ止まっているとみなす。
    # 収集が実際に回っているかは画面側の自己監視(ダッシュボード)で見る。
    healthcheck:
      test:
        - CMD-SHELL
        - test $(( $(date +%s) - $(stat -c %Y /tmp/worker-alive) )) -lt 180
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 外部ポートは公開しない
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      # backend: MySQL接続用(内部専用)
      # frontend: LAN上の監視対象(Docker Socket Proxy / HTTP)への到達用
      - backend
      - frontend

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Tokyo}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *default-logging
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # 外部ポートは公開しない
    networks:
      - backend

volumes:
  mysql-data:
  api-keys:

networks:
  frontend:
  backend:
    # backendは内部専用ネットワークとし、外部との直接通信を遮断する
    internal: true
