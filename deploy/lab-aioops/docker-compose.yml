# lab-aioops: 障害シナリオ検証用のテスト環境
#
# 本番のネットワーク・ボリューム・資格情報とは分離する。
# 検証専用VM(lab-aioops)上で起動し、本番サーバーでは起動しないこと。
name: lab-aioops

services:
  # Docker Socket Proxy。監視システムはこれ経由でのみDocker APIへ接続する。
  # 許可するAPIを最小限に絞り、exec・コンテナ作成/削除・イメージ操作を拒否する。
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    environment:
      # 参照系(監視に必要)
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      # コンテナの開始・停止・再起動(復旧に必要)
      POST: 1
      START: 1
      STOP: 1
      RESTART: 1
      # 拒否する操作
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      NETWORKS: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      NODES: 0
      TASKS: 0
      PLUGINS: 0
      DISTRIBUTION: 0
      AUTH: 0
    volumes:
      # Socket Proxyのみがdocker.sockを持つ。web/apiコンテナへは渡さない。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      # 監視システムから到達できるように公開する(LAN内限定で運用すること)
      - "${SOCKET_PROXY_PORT:-2375}:2375"
    networks:
      - lab

  # SC-01(コンテナ停止)/ SC-02(HTTP 503)用のテストWeb
  lab-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./lab-web/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LAB_WEB_PORT:-18080}:80"
    networks:
      - lab

  # SC-02(HTTP 503)を切り替えるテストAPI
  lab-api:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./lab-api/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LAB_API_PORT:-18081}:80"
    networks:
      - lab

  # SC-03(メモリ不足): メモリ上限を持つコンテナ内だけでOOMを起こす
  lab-memory:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "echo 'lab-memory ready (run scenario script to trigger OOM)'; sleep infinity"]
    mem_limit: 64m
    memswap_limit: 64m
    networks:
      - lab

  # SC-04(ディスク逼迫): サイズ制限したtmpfsのみを満たす
  lab-disk:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "echo 'lab-disk ready (run scenario script to fill tmpfs)'; sleep infinity"]
    tmpfs:
      - /scratch:size=16m
    networks:
      - lab

  # SC-05(未知ログ)/ ST-AI(プロンプト注入): 未登録のエラーログを出す
  lab-unknown-log:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "echo 'lab-unknown-log ready (run scenario script to emit logs)'; sleep infinity"]
    networks:
      - lab

networks:
  lab:
    # 本番ネットワークと分離する
    name: lab-aioops-net
