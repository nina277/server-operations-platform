# SC-02(HTTP 503)用のテストAPI。
# /health は通常200を返す。scenarios.sh sc02-on を実行すると503応答モードへ切り替わる。
server {
    listen 80;
    server_name _;

    location /health {
        # 503モードのフラグファイルが存在する場合は503を返す
        if (-f /etc/nginx/conf.d/503.flag) {
            return 503 '{"status":"unavailable","service":"lab-api"}';
        }

        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"lab-api"}';
    }

    location / {
        add_header Content-Type text/plain;
        return 200 'lab-api';
    }
}
