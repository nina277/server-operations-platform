# ログイン試行の制限。アプリ側にも制限があるが、
# ここで落とせる分はアプリまで到達させない(BCryptの検証は1回あたりが重い)。
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Dockerの内蔵DNS。**これが無いと api / web のIPを起動時に一度だけ解決して固定する。**
    #
    # 更新手順(`docker compose up -d --build`)では api や web だけが作り直され、
    # nginx はイメージも設定も変わらないため作り直されない。
    # その結果、作り直された側のIPが変わると nginx は古いIPへつなぎ続け、
    # **更新のたびに 502 になる**(nginx を手で再起動するまで直らない)。
    #
    # valid で保持時間を区切り、下の変数経由の proxy_pass と組み合わせて
    # 要求のたびに解決し直させる。ipv6=off はAAAAを引きに行って待たされるのを避けるため。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 画面から送るのは設定値とメモ程度で、大きな本文は受け取らない
    client_max_body_size 1m;

    # 版を隠す。既知の脆弱性を当てる手掛かりを与えない。
    server_tokens off;

    # ---- セキュリティヘッダ ----
    # LAN内に閉じる前提だが、閉じていることを唯一の守りにしない。
    # always を付けるのは、エラー応答にも付けるため。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # 外部の読み込みを許さない。connect-src を絞ることで、
    # 万一スクリプトが混入しても外部へデータを送れない。
    # style-src の unsafe-inline はVueが要素へ直接styleを当てるため必要。
    # Push通知を使う場合のみFirebaseの登録先を許す(使わないなら削ってよい)。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # ログインだけは別扱いで絞る。
    # burst で通常の打ち間違い数回は待たせずに通す。
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        # 変数を経由させると、起動時ではなく要求のたびに名前解決する。
        # URI部分を書かない形なので、元の要求パスがそのまま渡る(直書きのときと同じ)。
        set $api_backend "api:8080";
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # APIへのリバースプロキシ(パスはそのまま渡す)
    location /api/ {
        set $api_backend "api:8080";
        proxy_pass http://$api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # フロントエンド(SPA)
    location / {
        set $web_backend "web:80";
        proxy_pass http://$web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
